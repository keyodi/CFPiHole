# This workflow will install Python dependencies and run the update with simple fixed-delay retries in the same job
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application (Cloudflare)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 3,6'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Cache Poetry virtualenv and caches
      uses: actions/cache@v6
      with:
        path: |
          .venv
          ~/.cache/pypoetry
          ~/.cache/pip
        key: ${{ runner.os }}-poetry-3.14-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-3.14-
          ${{ runner.os }}-poetry-

    - name: Cache Poetry installation
      id: cache-poetry
      uses: actions/cache@v6
      with:
        path: |
          ~/.local/share/pypoetry
          ~/.local/bin/poetry
        key: ${{ runner.os }}-poetry-install-3.14

    - name: Install Poetry
      if: steps.cache-poetry.outputs.cache-hit != 'true'
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
    - name: Configure Poetry on PATH
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies with Poetry
      run: |
        # Ensure Poetry creates an in-project virtualenv at .venv
        poetry config virtualenvs.in-project true --local

        # Install without dev deps; --sync keeps .venv matching the lockfile exactly,
        # removing anything that's fallen out of poetry.lock (important since .venv is cached)
        poetry install --no-interaction --no-ansi --without dev --sync

    - name: Run update (with retries)
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_IDENTIFIER: ${{ secrets.CF_IDENTIFIER }}
        MAX_ATTEMPTS: 3      # total attempts (1 initial + retries)
        DELAY_SECONDS: 300   # fixed 5-minute wait between attempts
      run: |
        # Run update (with retries)
        max_attempts="$MAX_ATTEMPTS"
        delay_seconds="$DELAY_SECONDS"
        delay_minutes=$(( delay_seconds / 60 )) # convert to minutes

        attempt=1
        while true; do
          echo "Attempt $attempt of $max_attempts: running update..."

          set +e
          poetry run python main.py
          exit_code=$?
          set -e

          if [ $exit_code -eq 0 ]; then
            echo "Update succeeded on attempt $attempt."
            break
          fi

          if [ $exit_code -eq 64 ] && [ "$attempt" -lt "$max_attempts" ]; then
            echo "Rate limit (64) detected. Sleeping ${delay_minutes} min before retry..."
            sleep "${delay_seconds}"  
            attempt=$(( attempt + 1 ))
          else
            echo "Update failed with exit code $exit_code (or max retries reached)."
            exit 1
          fi
        done
