name: Update Cloudflare

on:
  workflow_dispatch:
  schedule:
    # Wed & Sat, 12:17 UTC. Off the top of the hour: :00 slots are the most
    # congested and scheduled runs there are often delayed or dropped.
    - cron: '17 12 * * 3,6'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: "2.2.1"   # set to the version you use locally

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned so a runner-image switch can't surprise you
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # nothing here pushes; don't leave the token on disk

      # Poetry must exist before setup-python so `cache: poetry` can find it.
      - name: Install Poetry (pinned)
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry   # keyed on poetry.lock + Python version; replaces both actions/cache steps

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --without dev --sync

      - name: Run update (retry on rate limit)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_IDENTIFIER: ${{ secrets.CF_IDENTIFIER }}
          PYTHONUNBUFFERED: "1"        # stream logs live instead of at exit
          MAX_ATTEMPTS: 3              # total attempts (1 initial + retries)
          BASE_DELAY_SECONDS: 300      # 5 min, then 10 min (linear backoff)
        run: |
          RATE_LIMIT_EXIT=64

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: running update..."

            code=0
            poetry run python main.py || code=$?

            if [ "$code" -eq 0 ]; then
              echo "Update succeeded on attempt ${attempt}."
              exit 0
            fi

            if [ "$code" -ne "$RATE_LIMIT_EXIT" ]; then
              echo "::error::Update failed with exit code ${code} (not retryable)."
              exit "$code"
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              delay=$(( BASE_DELAY_SECONDS * attempt ))
              echo "::warning::Rate limited (exit ${RATE_LIMIT_EXIT}). Retrying in $(( delay / 60 )) min..."
              sleep "$delay"
            fi
          done

          echo "::error::Still rate limited after ${MAX_ATTEMPTS} attempts."
          exit "$RATE_LIMIT_EXIT"
