[tool.poetry]
name = "cfpihole"
version = "0.1.0"
description = "Simple python script, runnable from GHA, that allows importing PiHole domain blocking lists into Cloudflare Zero-Trust Gateway configuration."
authors = ["Keyodi"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.33.0"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest =">=7,<10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
